<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }} | Home</a></p>

      {% if page.image %}<img class="post-image" src="{{ page.image | relative_url }}" alt="" width="1000" height="637">{% endif %}
      <h1>{{ page.html_title | default: page.title }}</h1>
      <p class="post-meta">{{ page.date | date: "%Y" }}</p>
      {{ content }}

      {% include contact.html %}
      {% include footer.html %}
    </div>
  </body>
</html>
